version: '3'
name: "smallsat"
services:
  smallsat:
    image: smallsat
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DISPLAY: ":0"
        USE_CUDA: "1"
    container_name: smallsat
    networks:
      - x11
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/code
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev:rw
    devices:
      - /dev/dri:/dev/dri
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    expose:
      - "20210-20230/udp"
      - "33300-33400/udp"
      - "5005/udp"
      - "5006/udp"
    ports:
      - "20210-20230:20210-20230/udp"
      - "33300-33400:33300-33400/udp"
    extra_hosts:
      - "host.docker.internal:172.17.0.1"

  ntp:
    image: cturra/ntp
    container_name: ntp
    restart: always
    ports:
      - 123:123/udp
    environment:
      - NTP_SERVERS=127.127.1.1
      - LOG_LEVEL=0

networks:
  x11:
