[build-system]
requires = ["setuptools>=42,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "smallsat_sim"  # Replace with your package name
version = "1.0.0"
description = "SmallSatSim"

dependencies = [
    "casadi==3.6.7",
    "numpy==2.2.6",
    "pyyaml==6.0.1",
    "mujoco==3.3.7",
    "mujoco-mjx==3.3.7",
    "glfw==2.8.0",
    "opencv-python==4.12.0.88",
    "scipy==1.15.3",
    "control==0.10.0",
    "h5py==3.12.1",
    "pandas==2.3.3",
    "psutil==6.1.0",
    "gpytorch==1.13", 
    "jax==0.6.2",
    "pytest==8.4.2",
    "optax==0.2.6",
    "flax==0.10.7",
    "distrax==0.1.5",
    "gpjax==0.12.2",
    "wandb==0.20.0",
    "warp-lang==1.9.1",
]

requires-python = ">=3.10"

[project.optional-dependencies]
cuda12 = ["jax[cuda12]"]

[tool.setuptools.packages.find]
where = ["src"]  # Source directory for the package
