[build-system]
requires = ["setuptools>=42,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "smallsat_sim"  # Replace with your package name
version = "1.0.0"
description = "SmallSatSim"

dependencies = [
    "casadi==3.6.7",
    "numpy==1.26.4",
    "pyyaml==6.0.1",
    "mujoco==3.3.6",
    "mujoco-mjx==3.3.6",
    "glfw==2.8.0",
    "opencv-python==4.10.0.82",
    "scipy==1.14.1",
    "control==0.10.0",
    "h5py==3.12.1",
    "pandas==2.2.2",
    "torch==2.5.1",
    "psutil==6.1.0",
    "gpytorch==1.13", 
    "pytest",
    "brax==0.10.5",
    "optax==0.2.3",
    "flax==0.10.5",
    "distrax==0.1.5",
    "tensorflow-probability==0.24.0",
    "wandb==0.17.8",
    "gpflow==2.9.2",
    "warp-lang",
]

requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]  # Source directory for the package
